name: Containerd default import check
on:
  push:
    branches: [validation/flatcar-pr-repairs-20260913]
permissions:
  contents: read
jobs:
  containerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download containerd 2.3.4
        run: |
          mkdir -p "$RUNNER_TEMP/containerd-bin"
          cd "$RUNNER_TEMP/containerd-bin"
          curl -fL --retry 3 -o containerd.tar.gz https://github.com/containerd/containerd/releases/download/v2.3.4/containerd-2.3.4-linux-amd64.tar.gz
          echo '9d68969855fbf676cdb8ed758e420fb048d61f984f61de3e53eddfebe484d168  containerd.tar.gz' | sha256sum -c -
          tar -xzf containerd.tar.gz
      - name: Check the real default import directory
        run: |
          sudo python3 .repair-validation/default-import-check.py \
            "$PWD/.repair-validation/baseline" \
            "$PWD/sdk_container/src/third_party/coreos-overlay/coreos/sysext/containerd/usr/share/containerd" \
            "$RUNNER_TEMP/containerd-bin/bin/containerd" "$RUNNER_TEMP/default-import-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: default-import-evidence
          path: ${{ runner.temp }}/default-import-check
